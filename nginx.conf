server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests internally to the backend (Docker network)
  # Strips /kindergarten/api/v1 prefix — backend routes are bare (/auth/login, /campus, etc.)
  location /kindergarten/api/ {
    rewrite ^/kindergarten/api/v1/(.*) /$1 break;
    proxy_pass http://castlerock-test:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: serve static files directly
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri =404;
  }
}